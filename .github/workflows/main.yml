name: Build Vietnamese Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "taiqiu_offline-vietnamese*.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: vietnamese-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate and safely extract Vietnamese source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t archives < <(
            find . -maxdepth 1 -type f -name 'taiqiu_offline-vietnamese*.zip' -print
          )

          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one taiqiu_offline-vietnamese*.zip at repository root; found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi

          export SOURCE_ZIP="${archives[0]}"

          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          archive = pathlib.Path(os.environ["SOURCE_ZIP"])
          destination = pathlib.Path("_build_source").resolve()
          destination.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  target = (destination / item.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe path in ZIP: {item.filename!r}")
              zf.extractall(destination)

          matches = list(destination.rglob("billiards-cn/package-lock.json"))
          if len(matches) != 1:
              raise SystemExit(
                  "Expected exactly one billiards-cn/package-lock.json; "
                  f"found {len(matches)}"
              )

          project_root = matches[0].parent.parent
          required = [
              project_root / "billiards-cn/package.json",
              project_root / "billiards-cn/package-lock.json",
              project_root / "billiards-cn/webpack.config.js",
              project_root / "billiards-apk/build-apk.sh",
              project_root / "billiards-apk/AndroidManifest.xml",
              project_root / "billiards-apk/patch_manifest.py",
              project_root / "billiards-apk/pyzipalign.py",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required project files: " + ", ".join(missing))

          relative_root = project_root.relative_to(pathlib.Path.cwd())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"root={relative_root.as_posix()}\n")
          print(f"Project root: {relative_root}")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ steps.source.outputs.root }}/billiards-cn/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Could not find an executable Android sdkmanager under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          # Accept licenses without asking sdkmanager to install the obsolete "tools" package.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/34.0.0/d8"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: Install frontend dependencies
        working-directory: ${{ steps.source.outputs.root }}/billiards-cn
        run: npm ci

      - name: Build Vietnamese frontend
        working-directory: ${{ steps.source.outputs.root }}/billiards-cn
        run: npm run build

      - name: Build Android APK
        working-directory: ${{ steps.source.outputs.root }}/billiards-apk
        env:
          ANDROID_SDK: ${{ env.ANDROID_HOME }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build-apk.sh
          ./build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: billiards-vietnamese-apk
          path: |
            ${{ steps.source.outputs.root }}/billiards-apk/billiards-vi*.apk
          if-no-files-found: error
          retention-days: 14
